syntax = "proto3";

package kaizen.audience.v1;

// AudienceOperator identifies a comparison supported by an audience predicate.
enum AudienceOperator {
  AUDIENCE_OPERATOR_UNSPECIFIED = 0;
  AUDIENCE_OPERATOR_EQUALS = 1;
  AUDIENCE_OPERATOR_NOT_EQUALS = 2;
  AUDIENCE_OPERATOR_IN = 3;
  AUDIENCE_OPERATOR_NOT_IN = 4;
  AUDIENCE_OPERATOR_GREATER_THAN = 5;
  AUDIENCE_OPERATOR_GREATER_THAN_OR_EQUALS = 6;
  AUDIENCE_OPERATOR_LESS_THAN = 7;
  AUDIENCE_OPERATOR_LESS_THAN_OR_EQUALS = 8;
  AUDIENCE_OPERATOR_CONTAINS = 9;
  AUDIENCE_OPERATOR_REGEX = 10;
  AUDIENCE_OPERATOR_EXISTS = 11;
  AUDIENCE_OPERATOR_NOT_EXISTS = 12;
}
